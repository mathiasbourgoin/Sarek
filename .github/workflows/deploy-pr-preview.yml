name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'gh-pages/**'
      - '.github/workflows/deploy-pr-preview.yml'
      - 'benchmarks/results/**'
      - 'benchmarks/*.ml'
      - 'benchmarks/dune'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-22.04  # Use 22.04 where darcs is available
    # Only run for PRs from the main repository (not forks) to prevent malicious gh-pages content
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # deploys the preview to gh-pages
      pull-requests: write # comments the preview URL
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@8cc6339f55862749298d198ef84788b8d6acdacc # v2.2.10
        with:
          ocaml-compiler: 5.4.x
          dune-cache: false
      
      - name: Install dependencies
        run: |
          opam install -y yojson
          opam install . --deps-only --with-doc -y
          opam install -y odoc
      
      - name: Build benchmark tools
        run: |
          opam exec -- dune build benchmarks/to_web.exe
      
      - name: Convert benchmark results to web format
        run: |
          # Check if there are any benchmark result files
          if ls benchmarks/results/*.json 1> /dev/null 2>&1; then
            echo "Found benchmark results, converting to web format..."
            opam exec -- dune exec benchmarks/to_web.exe -- \
              gh-pages/benchmarks/data/latest.json \
              benchmarks/results/*.json
            echo "✅ Conversion complete"
          else
            echo "ℹ️  No benchmark results found in benchmarks/results/"
            # Create empty results file for preview
            echo '{"results":[],"updated_at":"'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > gh-pages/benchmarks/data/latest.json
          fi
      
      - name: Update _config.yml for preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Update baseurl in _config.yml to match preview path
          sed -i 's|baseurl: /Sarek|baseurl: /Sarek/preview/pr-'"${PR_NUMBER}"'|' gh-pages/_config.yml
          echo "✅ Updated _config.yml baseurl for preview"
      
      - name: Setup Ruby for Jekyll
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.1'
          bundler-cache: false
      
      - name: Install Jekyll
        run: |
          gem install jekyll bundler
          cd gh-pages && bundle install
      
      - name: Build Jekyll site
        run: |
          cd gh-pages
          bundle exec jekyll build --destination _site
          echo "✅ Jekyll site built successfully"
      
      - name: Build API documentation (odoc)
        run: |
          # The layouts link to {baseurl}/spoc_docs/index.html; docs.yml
          # publishes the odoc output there, so previews must do the same.
          opam exec -- dune build @doc
          mkdir -p gh-pages/_site/spoc_docs
          cp -r _build/default/_doc/_html/* gh-pages/_site/spoc_docs/

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: gh-pages/_site
          target-folder: preview/pr-${{ github.event.pull_request.number }}
          clean: false
          commit-message: "Deploy preview for PR #${{ github.event.pull_request.number }}"
      
      - name: Comment preview URL on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://mathiasbourgoin.github.io/Sarek/preview/pr-${prNumber}/`;
            const benchmarkUrl = `${previewUrl}benchmarks/`;
            
            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview your changes')
            );
            
            const benchmarkSummary = await getBenchmarkSummary();
            
            const commentBody = `## 🔍 Preview Deployment
            
            Your changes are ready to preview:
            
            - **Main page:** ${previewUrl}
            - **Benchmarks:** ${benchmarkUrl}
            
            <details>
            <summary>📊 Benchmark Results</summary>
            
            ${benchmarkSummary}
            
            </details>
            
            ---
            
            *This preview updates automatically when you push new commits.*
            *Preview deployments are cleaned up after the PR is closed.*`;
            
            async function getBenchmarkSummary() {
              try {
                const fs = require('fs');
                const dataFile = 'gh-pages/benchmarks/data/latest.json';
                
                if (!fs.existsSync(dataFile)) {
                  return 'No benchmark results found in this PR.';
                }
                
                const data = JSON.parse(fs.readFileSync(dataFile, 'utf8'));
                
                if (!data.results || data.results.length === 0) {
                  return 'No benchmark results found in this PR.';
                }
                
                let summary = '**Benchmark Results Found:**\n\n';
                
                data.results.forEach(result => {
                  const benchmark = result.benchmark;
                  const system = result.system;
                  const deviceCount = result.results.length;
                  
                  summary += `- **${benchmark.name}** (size ${benchmark.parameters.size})\n`;
                  summary += `  - System: ${system.hostname} - ${system.cpu.model}\n`;
                  summary += `  - Devices tested: ${deviceCount}\n`;
                  summary += `  - Timestamp: ${benchmark.timestamp}\n\n`;
                });
                
                return summary;
              } catch (err) {
                return `Error reading benchmark data: ${err.message}`;
              }
            }
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
