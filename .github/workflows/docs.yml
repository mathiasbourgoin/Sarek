name: Build and Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # deploys to gh-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.4.0

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-doc
          opam install odoc ppxlib dune js_of_ocaml js_of_ocaml-ppx js_of_ocaml-compiler

      - name: Build Documentation
        run: |
          opam exec -- dune build @doc

      - name: Apply Custom Style
        run: |
          # Find where odoc.css actually is
          CSS_FILE=$(find _build -name "odoc.css" | head -n 1)
          if [ -f "$CSS_FILE" ]; then
            echo "Found odoc.css at $CSS_FILE"
            chmod +w "$CSS_FILE"
            cat docs/odoc_custom.css >> "$CSS_FILE"
          else
            echo "Error: odoc.css not found"
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: gh-pages

      - name: Build transpiler JS bundle
        run: |
          opam exec -- dune build sarek/transpile/web/transpile_js.bc.js
          cp _build/default/sarek/transpile/web/transpile_js.bc.js gh-pages/javascripts/sarek_transpile.js
          opam exec -- dune build sarek/core_js/webgpu/lessons/compose_driver.bc.js
          cp _build/default/sarek/core_js/webgpu/lessons/compose_driver.bc.js gh-pages/javascripts/spoc_compose.js

      - name: Build Jekyll site
        run: |
          cd gh-pages
          bundle install
          bundle exec jekyll build

      - name: Combine documentation
        run: |
          # Copy Jekyll output to deployment directory
          mkdir -p _site
          cp -r gh-pages/_site/* _site/
          # Copy odoc output to spoc_docs subfolder
          mkdir -p _site/spoc_docs
          cp -r _build/default/_doc/_html/* _site/spoc_docs/
          # Add .nojekyll to tell GitHub Pages not to process with Jekyll
          touch _site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean: true # Clean the branch since we're deploying everything
          # Talk PDFs are hosted on the branch only (not in main): keep them.
          clean-exclude: |
            docs/talks
