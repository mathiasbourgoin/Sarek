name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.4.0
        cache:
          - true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Least privilege, same precedent as `formal-proofs` (#294): without an
    # explicit block this job inherits the repository default token scope
    # (zizmor: excessive-permissions). Every step here only reads the checkout
    # and runs builds/tests in a container — no `git push`, no `gh`, no
    # `secrets.*`, no `GITHUB_TOKEN`, and build-push-action runs with
    # `load: true`, never `push: true`. The `actions/cache`, buildx `type=gha`
    # cache and `actions/upload-artifact` steps authenticate with the runner's
    # own job-scoped ACTIONS_RUNTIME_TOKEN, not with GITHUB_TOKEN, so they are
    # unaffected by this block.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # backlog-152. Load-bearing, not a convenience. The default is
          # `fetch-depth: 1`, and on a `pull_request` event GitHub fetches
          # `refs/pull/N/merge` into a detached HEAD with NO
          # `refs/remotes/origin/main` — so every git-history-dependent gate
          # here reads a repository in which it cannot look anything up.
          # `scripts/check-review-convergence-hardening.test.js` did exactly
          # that: its upstream-diff tier silently ran zero comparisons and
          # printed ok on every PR, while the same commit failed on push to
          # main (where checkout DOES create origin/main). Same job name, same
          # bytes, opposite verdicts, and no `github.event_name` conditional
          # anywhere — the asymmetry was the checkout, not the workflow. About
          # twenty PRs merged green onto a main that was already red.
          #
          # The gate now fails closed when the history is not there, so a
          # regression of this line turns the pull_request job RED rather than
          # returning it to a silent pass.
          fetch-depth: 0

      # Runs on the CI checkout, which is exactly the "fresh clone" case: if the
      # review-tool bundle is workstation-local again, this step is the only
      # thing that notices. review-bundle-verify alone cannot — an untracked
      # bundle verifies perfectly on the machine that has it.
      - name: Review-tool bundle tracked + intact
        run: ./scripts/check-review-bundle-tracked.sh

      - name: Test alias coverage guard
        run: ./scripts/check-test-alias-coverage.sh

      # #147. The alias-coverage guard above assumes dune can SEE the dune file
      # it is auditing. A `(dirs ...)` stanza can put a whole directory outside
      # dune's traversal, at which point its tests do not build, do not run and
      # do not format-check -- and nothing goes red, because to dune there is
      # nothing there. That is how sarek/sarek/test/'s seven test executables
      # sat unbuilt behind a stale `(dirs ir_extract)`.
      - name: Dune directory visibility guard
        run: ./scripts/check-dune-dir-visibility.sh

      # #137. This checker existed for months, exited 1 on `main`, and was
      # referenced by no workflow and no Makefile target -- the fourth
      # "declared gate that nothing invokes" found in this repo. It is wired
      # here, and its red path is covered in the harness block below.
      # Exit 2 means the coverage declaration is broken (a root moved), not
      # that a header is missing; see scripts/check-license-headers.sh.
      - name: License header guard
        run: ./scripts/check-license-headers.sh

      # An unregistered Alcotest case compiles, the suite reports green, and
      # the behavior it was written to protect is unguarded. Nothing else in
      # this pipeline can tell that apart from a passing test.
      - name: Alcotest case registration guard
        run: node scripts/check-alcotest-registration.js

      # backlog-100. Executes the fenced `code-intel` declarations in
      # kb/properties.md. The roster's own runner for that block
      # (scripts/code-intel-resolve.js) is not installed here and no skill
      # declares `capability: code-intel`, so roster-qa's documented behaviour
      # would be RESULT: skip -- a block of invariants that reads as enforced
      # and is executed by nothing. This step is what makes it real on a fresh
      # clone. Exit 2 means the block is malformed, which is never a skip.
      - name: KB properties (code-intel) gate
        run: ./scripts/check-kb-properties.sh

      # backlog-151. The step above enforces that every gate DECLARES whether
      # it has a red-path test. This one executes the declaration: it copies
      # each subject into a scratch tree, applies the mutations declared beside
      # it, and requires the exact exit code and the exact message each one
      # promises -- with a mandatory positive control first, because "went red"
      # and "is always red" are otherwise the same observation. It is its own
      # subject (scripts/prove-red-fixtures/), so a version of it that credited
      # an immune checker would fail here rather than print a second green.
      # ~0.5s for 4 subjects and 13 mutations; it never runs the test suite.
      - name: Prove-red (gates are mutated and observed to fail)
        run: ./scripts/prove-red.sh

      # The harness's own guards. They gate everything else, so they are the
      # last place a silent regression is acceptable.
      - name: Harness self-tests
        run: |
          set -e
          node scripts/review-verdict-assemble.test.js
          node scripts/xruntime-caller-fault.test.js
          # The #98 local patch's covering test. It is what attests that the
          # convergence gate still fails closed, so it has to be a test something
          # actually runs — a `make` target nobody invokes is not that.
          node scripts/check-review-convergence-hardening.test.js
          node scripts/check-mandated-steps.test.js
          node scripts/check-alcotest-registration.test.js
          # backlog-135. The ledger schema had no covering test of its own --
          # it was exercised only incidentally by the post-hook's test, which
          # cares about the hook rather than the rules. The skip record it now
          # carries exists to REJECT something (a skip that names no reason and
          # no actor), so it gets a test that watches it reject.
          node scripts/ledger-schema.test.js
          ./scripts/check-review-bundle-tracked.test.sh
          ./scripts/agent-worktree-bootstrap.test.sh
          ./scripts/roster-implement-posthook.test.sh
          # #95. Covering test for the proof-ledger/axiom-allowlist gate. It
          # runs HERE, in the fast job, rather than beside the gate itself in
          # `formal-proofs`: it needs no Rocq (it synthesises the generated
          # ledgers), it takes about a second, and putting the enforcement's own
          # red-path coverage behind a 50-second container pull is how a gate
          # ends up untested.
          ./scripts/check-proof-ledger.test.sh
          # #94. Lexical companion to sarek/tests/unit/test_backend_arm_parity.ml:
          # asserts every intrinsic name matched by any backend's `arm` table has
          # a row in that test's matrix. The test itself probes BEHAVIOUR (it has
          # to — pre_hook/post_hook handle names that appear in no arm), but it
          # can only probe names it was told about, so a name added to one
          # backend and to no list would leave it green having checked nothing.
          ./scripts/check-arm-parity-coverage.sh
          # #147. Red-path coverage for the visibility guard. A guard against
          # "green because nothing was looked at" is worth nothing if its own
          # green is taken on faith, so this asserts it fails on all four
          # invisibility shapes and refuses to guess at predicates it cannot
          # parse.
          ./scripts/check-dune-dir-visibility.test.sh
          # #147 follow-up. Two agents reported different totals for the same
          # commit because Alcotest singularises ("1 test run.") and a
          # plural-only grep drops those suites. "0 FAIL of N" is only as
          # trustworthy as N, so the counting rule gets a covering test like
          # any other gate.
          ./scripts/test-suite-counts.test.sh
          # #137. Red-path coverage for the license guard. Its pre-#137 finder
          # ended in `2>/dev/null`, so deleting a whole declared root made it
          # print "All license headers are up-to-date!" about a tree it had
          # not read. Cases 4 and 5 assert that shape is now exit 2, and case 0
          # is the positive control without which "went red" and "is always
          # red" would be the same observation.
          ./scripts/check-license-headers.test.sh
          # backlog-99. The pocl probe is informational and exits 0 by design,
          # which is the shape that rots unnoticed: nothing reads its exit
          # code, so a probe that stopped measuring would keep printing a
          # verdict indistinguishable from a real one. This asserts the verdict
          # tracks the stages, and that no combination of failures -- including
          # a probe that never built -- can report POCL-WORKS. It is hermetic
          # (a stub compiler supplies the stage results) and needs no pocl, so
          # it runs here rather than in the probe job.
          ./ci/pocl-runner-probe.test.sh
          # backlog-100. The KB gate audits whether other gates can fail, so
          # taking its own green on faith would be the joke version of it. All
          # five check types are mutated -- both the declaration and the target
          # source -- and case 0 is the positive control without which every
          # red below it proves nothing.
          ./scripts/check-kb-properties.test.sh
          # backlog-151. prove-red.sh exists to catch checkers that cannot
          # fail, so "prove-red.sh cannot fail" is the most expensive thing
          # that could go wrong in this repository. Nineteen cases, exact exit
          # codes throughout (its contract separates 1 = the subject did not
          # fail from 2 = the mechanism produced no evidence, and an assertion
          # accepting "non-zero" would not notice those being swapped), and
          # case 0 is the positive control.
          ./scripts/prove-red.test.sh

      - name: Formal proofs admit gate
        run: |
          # Fast LEXICAL tripwire only. It runs without a Rocq toolchain and
          # catches an `Admitted.` in seconds, but a grep is not a proof: it
          # cannot tell whether the sources still compile or whether the
          # committed .vo files match them. The machine-checked guarantee is
          # the `formal-proofs` job below, which rebuilds every .v from scratch
          # and runs `rocq check` (#45). Keep both: this one for the fast
          # signal, that one for the assurance.
          #
          # Word-boundary regex with optional space before the terminating dot
          # catches bulleted tactics (`- admit.`), same-line sequences
          # (`Proof. Admitted.`) and `Axiom(`/`Axioms`.
          # Note: `Parameter` remains a sanctioned escape hatch (see
          # AGpuSemantics.v) - this gate enforces the textual invariant only.
          set +e
          ls formal/*/theories/*.v >/dev/null 2>&1 || { echo "::error::admit gate could not find formal .v files"; exit 1; }
          matches=$(grep -rnE "(^|[^[:alnum:]_'])((Admitted|admit)[[:space:]]*\.|Axioms?([[:space:]]|\())" formal --include='*.v')
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "$matches"
            echo "::error::Admitted/admit/Axiom found in formal/ .v files"
            exit 1
          elif [ "$rc" -ge 2 ]; then
            echo "::error::admit gate grep failed (rc=$rc)"
            exit 1
          fi
          echo "OK: no Admitted/admit/Axiom in formal/ .v files"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache key
        run: echo "CACHE_WEEK=$(date +%G-%V)" >> $GITHUB_ENV

      - name: Build CI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci/Dockerfile
          tags: spoc-ci:latest
          load: true
          build-args: |
            CACHEBUST=${{ env.CACHE_WEEK }}
          cache-from: type=gha,scope=spoc-ci-${{ hashFiles('ci/Dockerfile') }}
          cache-to: type=gha,scope=spoc-ci-${{ hashFiles('ci/Dockerfile') }},mode=max

      # Fail fast, before anything is built. Every codegen gate self-skips when
      # its tool is missing, which is correct on a developer machine and
      # catastrophic here: the previous image carried none of ptxas, NVRTC,
      # glslangValidator, naga or a conformant OpenCL ICD, so the gates all
      # printed SKIP and CI reported success having validated nothing. This step
      # is what makes a regression of ci/Dockerfile a red build instead of a
      # silent return to green-but-vacuous. See ci/assert-toolchain.sh.
      - name: Assert codegen toolchain is present and runnable
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc './ci/assert-toolchain.sh'

      - name: Cache opam root
        uses: actions/cache@v4
        with:
          path: .opam-ci
          key: opam-${{ runner.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('*.opam') }}
          restore-keys: |
            opam-${{ runner.os }}-${{ matrix.ocaml-compiler }}-

      - name: Build SPOC packages
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              git config --global --add safe.directory "*" && \
              export OPAMROOT=/work/.opam-ci && \
              if [ ! -d "$OPAMROOT" ]; then \
                opam init --compiler=${{ matrix.ocaml-compiler }} --disable-sandboxing --no-setup; \
              else \
                opam switch set ${{ matrix.ocaml-compiler }} || \
                  opam switch create ${{ matrix.ocaml-compiler }}; \
              fi && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              opam repo add alpha git+https://github.com/kit-ty-kate/opam-alpha-repository.git --set-default || true && \
              opam update && \
              opam install -y ctypes ctypes-foreign ppxlib alcotest qcheck-core js_of_ocaml js_of_ocaml-ppx js_of_ocaml-compiler ocamlformat.0.28.1 && \
              dune build @install'

      # #122: nothing enforced `.ocamlformat`, so formatting drift accumulated
      # on main unnoticed (Device.ml, Sarek_float32.ml, test_ir_layout.ml).
      #
      # `ocamlformat` is pinned to 0.28.1 to match `version=0.28.1` in
      # `.ocamlformat`; ocamlformat refuses to run on a version mismatch, so the
      # pin cannot silently drift from the config. And when ocamlformat is
      # absent entirely dune fails with "Program ocamlformat not found in the
      # tree or in PATH" rather than skipping the alias — verified locally — so
      # unlike the codegen gates this one cannot self-skip into a vacuous green.
      - name: Formatting gate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              dune build @fmt'

      - name: jsoo-compat gate
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              dune build sarek/transpile/web/transpile_js.bc.js'

      - name: Run unit tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              dune runtest'

      # No OCL_ICD_VENDORS pinning: the image ships exactly one OpenCL ICD, the
      # Intel oneAPI CPU runtime. Adding pocl as a second, conformant ICD (#79)
      # and pinning e2e to it made things strictly worse — pocl 1.8 + LLVM 11 on
      # jammy compiles no kernel at all, so the float32 math tests SKIPPED — and
      # it moves to a separate experimental PR. See ci/Dockerfile.
      - name: Run fast e2e tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              make e2e-fast'

      - name: Run negative tests (expected compile errors)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              make test_negative'

      - name: Run coverage
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              eval $(opam env --switch=${{ matrix.ocaml-compiler }}) && \
              ./scripts/coverage-unit.sh'

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: _coverage/unit-report
          retention-days: 30
          if-no-files-found: ignore

  # #45: make the formal-proof guarantee machine-checked instead of grepped.
  #
  # The admit gate in the `build` job is a grep over .v sources, and the
  # committed .vo files were never re-verified on a branch — a lexical check
  # standing in for a proof. This job rebuilds every .v from scratch (deleting
  # the committed .vo first, so they cannot vouch for themselves) and runs
  # `rocq check`, the standalone kernel re-checker.
  #
  # Cost, measured on Rocq 9.1.1 with all artefacts deleted: ~11 s to compile
  # all three projects and ~39 s to kernel-re-check them, ~50 s of CPU total.
  # The toolchain is deliberately NOT added to ci/Dockerfile — the official
  # rocq/rocq-prover image already ships the exact version these proofs were
  # developed against, and pinning it here costs an image pull instead of a
  # multi-minute Rocq build baked into every CI image rebuild.
  # backlog-99. EXPERIMENTAL, INFORMATIONAL, GATES NOTHING.
  #
  # Every OpenCL claim this project makes rests on one runtime: the Intel
  # oneAPI CPU ICD inside ci/Dockerfile. Nobody has measured what a bare
  # GitHub runner does, so there is no second, independent OpenCL execution
  # environment and no way to tell an oneAPI-specific result from a real one.
  #
  # backlog-79 tried pocl once, in the image, and pinned e2e to it: pocl 1.8 +
  # LLVM 11 on jammy compiled no kernel, the float32 tests SKIPPED, and CI went
  # green having validated nothing. ci/assert-toolchain.sh records that and
  # says the retry belongs in "a separate experimental PR that installs it
  # unpinned and reports whether it can compile on the real GitHub runner".
  # This is that. The measured failure was a property of jammy's pocl, and
  # ubuntu-latest ships one several major versions newer.
  #
  # Deliberately: `continue-on-error` and a probe that exits 0 on its own. No
  # test is redirected to pocl, no gate consults the verdict, and a red result
  # is a good result -- "a bare runner cannot run an OpenCL kernel either" is
  # information the project does not have today. Promoting this to a gate is a
  # separate decision that needs a green here first.
  #
  # MEASURED 2026-07-27 (run 30282252291): VERDICT=POCL-WORKS. Ubuntu 24.04.4,
  # pocl 5.0, cpu-haswell device; compiled, ran 1024/1024 elements correctly,
  # and rejected invalid source. backlog-79's "pocl compiles nothing" was pocl
  # 1.8 + LLVM 11 on jammy inside the image, not a fact about pocl. See the
  # header of ci/pocl-runner-probe.sh for what this does and does not license.
  # Still not promoted to a gate: one green is not a stability record, and this
  # installs an unpinned apt package.
  pocl-runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Unpinned on purpose: whatever the runner's distribution ships is the
      # thing being measured. Pinning a version would answer a question nobody
      # asked.
      - name: Install pocl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pocl-opencl-icd ocl-icd-opencl-dev clinfo
          apt-cache policy pocl-opencl-icd || true

      - name: Probe whether pocl can compile and run a kernel
        run: ./ci/pocl-runner-probe.sh

      # The verdict is the deliverable, so it goes somewhere a human reads
      # without opening the log.
      - name: Record the verdict in the job summary
        if: always()
        run: |
          {
            echo "## pocl on a bare runner (backlog-99)"
            echo
            echo '```'
            ./ci/pocl-runner-probe.sh 2>&1 | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  formal-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege: this job only reads the checkout and runs rocq in a
    # container. Without an explicit block it would inherit the repository
    # default token scope (zizmor: excessive-permissions).
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Deliberately `docker run` rather than a job-level `container:`.
      #
      # A `container:` job does NOT work here, and the failure is silent-ish:
      # GitHub Actions discards the image ENTRYPOINT (["opam","exec","--"]) and
      # runs every step through `docker exec sh -e -c`, so the opam switch's
      # bin/ never reaches PATH and rocq, coqc and rocqchk all look MISSING —
      # the real binaries live in /home/rocq/.opam/4.14.2+flambda/bin. Adding
      # `options: --user root` to fix workspace permissions makes it worse: the
      # switch belongs to the `rocq` user under /home/rocq, so opam refuses it.
      #
      # `docker run` honours the ENTRYPOINT, runs as the image's own user, and
      # matches how every other step in this workflow invokes a container.
      # The chown is required, not tidiness. rocq/rocq-prover runs as its own
      # `rocq` user (uid 1000); a GitHub-hosted runner owns the checkout as
      # `runner` (uid 1001) with mode 0755. check-formal-proofs.sh rebuilds in
      # place — it deletes the committed .vo files and regenerates CoqMakefile
      # beside the sources — so without this the container cannot write a single
      # file and the job dies on step 1 with EACCES.
      #
      # Measured, not assumed: a uid-1000 process in this image cannot create or
      # unlink a file in a uid-1001 0755 bind mount. It is invisible when the
      # script is run locally, because a developer's checkout is already owned by
      # the user running it — the job passing on a workstation says nothing about
      # this. The script now probes writability up front so a future regression
      # of this line fails with that sentence instead of a confusing rm error.
      #
      # chown rather than `--user`: the ENTRYPOINT is ["opam","exec","--"] and
      # the opam switch lives under /home/rocq, so running as any other uid (or
      # as root, HOME=/root) loses the switch and rocq/coqc look MISSING.
      - name: Rebuild and kernel-re-check the Rocq proofs
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            rocq/rocq-prover:9.1.1 \
            bash -lc './scripts/check-formal-proofs.sh'

  check-generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Least privilege, same precedent as `formal-proofs` (#294). This job
    # regenerates the backend code and asserts the working tree is unchanged;
    # it only ever *reads* git state (`git diff --quiet` / `--stat`). The
    # `git commit` on the failure path is text inside an `echo`, telling a
    # human what to run locally — nothing here writes to the repository.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache key
        run: echo "CACHE_WEEK=$(date +%G-%V)" >> $GITHUB_ENV

      - name: Build CI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci/Dockerfile
          tags: spoc-ci:latest
          load: true
          build-args: |
            CACHEBUST=${{ env.CACHE_WEEK }}
          cache-from: type=gha,scope=spoc-ci-${{ hashFiles('ci/Dockerfile') }}
          cache-to: type=gha,scope=spoc-ci-${{ hashFiles('ci/Dockerfile') }},mode=max

      - name: Cache opam root
        uses: actions/cache@v4
        with:
          path: .opam-ci
          key: opam-${{ runner.os }}-5.4.0-${{ hashFiles('*.opam') }}
          restore-keys: |
            opam-${{ runner.os }}-5.4.0-

      - name: Setup and generate backend code
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            spoc-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && \
              export OPAMROOT=/work/.opam-ci && \
              if [ ! -d "$OPAMROOT" ]; then \
                opam init --compiler=5.4.0 --disable-sandboxing --no-setup; \
              else \
                opam switch set 5.4.0 || opam switch create 5.4.0; \
              fi && \
              eval $(opam env --switch=5.4.0) && \
              opam repo add alpha git+https://github.com/kit-ty-kate/opam-alpha-repository.git --set-default || true && \
              opam update && \
              opam install -y ctypes ctypes-foreign ppxlib && \
              dune build benchmarks/generate_backend_code.exe && \
              dune exec benchmarks/generate_backend_code.exe'

      - name: Check for generated code changes
        run: |
          if ! git diff --quiet benchmarks/descriptions/generated/; then
            echo "❌ Generated backend code is out of sync!"
            echo ""
            echo "The generated backend code has changed. This could indicate:"
            echo "  1. The generator tool was modified"
            echo "  2. A kernel was changed but generated code wasn't updated"
            echo "  3. Backend code generators have been updated"
            echo ""
            echo "Changes detected:"
            git diff --stat benchmarks/descriptions/generated/
            echo ""
            echo "To fix this, run locally:"
            echo "  dune exec benchmarks/generate_backend_code.exe"
            echo "  git add benchmarks/descriptions/generated/"
            echo "  git commit -m 'Update generated backend code'"
            echo ""
            exit 1
          else
            echo "✅ Generated backend code is up to date"
          fi
